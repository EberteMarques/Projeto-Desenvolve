<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contêiner com Barra de Rolagem</title>
    <style>
        .container {
            height: 200px; /* Altura fixa */
            overflow-y: scroll; /* Barra de rolagem vertical */
            padding: 10px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            background-image: url('logo_clube_cruzeiro_itabirano\logo.png');
        }
        .content {
            height: 500px; /* Conteúdo mais alto que o contêiner para demonstrar a barra de rolagem */
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <p>Conteúdo extenso que exige rolagem...</p>
            <p>Mais conteúdo...</p>
            <p>Ainda mais conteúdo...</p>
        </div>
    </div>
</body>
</html>
